name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: foresight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d foresight_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: Run fixture evaluation
        working-directory: packages/evals
        run: |
          node dist/cli.js fixtures/example.json fixtures/baseline.json "$RUNNER_TEMP/eval-result.json"
          node -e 'const r = require(process.argv[1]); if (r.schemaVersion !== 1 || r.value !== 0.75 || !r.passed) process.exit(1)' "$RUNNER_TEMP/eval-result.json"
      - name: Database migrations and integration tests
        working-directory: packages/db
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/foresight_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/foresight_test
        run: |
          bun run migrate
          bun run test
